<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>Suno Recorder</h1>
        <p>Library capture · no download quota</p>
      </div>
    </header>

    <p class="hero-line">
      Open <strong>suno.com/me</strong>, then start. Plays each row and saves a clean WAV per track.
    </p>

    <div class="meter" id="meter" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="startBtn">Start recording</button>
      <button type="button" class="btn-secondary" id="stopBtn">Stop</button>
    </div>

    <section class="status-block" aria-live="polite">
      <div class="status-label">Status</div>
      <div id="status">Ready</div>
      <div class="progress" id="progressWrap" hidden>
        <i id="progressBar"></i>
      </div>
      <div id="log"></div>
      <div id="error"></div>
    </section>

    <div class="footer-row">
      <p class="hint">Popup can close — capture keeps running. Reopen anytime.</p>
      <button type="button" class="linkish" id="optionsLink">Options</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
